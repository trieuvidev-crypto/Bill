<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DEV BY TRIEU VI</title>

<style>

*{
box-sizing:border-box;
font-family:system-ui;
}

body{
margin:0;
background:#f2f4f7;
}

/* HEADER */

header{
background:#1976d2;
color:white;
padding:16px;
font-size:20px;
font-weight:bold;
text-align:center;
}

/* TABLE GRID */

.tables{
padding:12px;
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
}

.table{
background:#e3f2fd;
border-radius:16px;
padding:14px;
cursor:pointer;
box-shadow:0 4px 10px rgba(0,0,0,.05);
}

.table h3{
margin:0;
}

.money{
color:#0d47a1;
font-weight:bold;
margin-top:6px;
font-size:18px;
}

/* MODAL */

.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.45);
display:none;
justify-content:center;
align-items:center;
}

.modal-box{
background:white;
width:95%;
max-width:500px;
height:90%;
border-radius:18px;
display:flex;
flex-direction:column;
overflow:hidden;
}

/* MENU */

.menu{
flex:1;
overflow:auto;
padding:10px;
}

.category{
font-weight:bold;
margin-top:10px;
}

.item-btn{
width:100%;
padding:12px;
margin:4px 0;
border:none;
border-radius:10px;
background:#1976d2;
color:white;
font-size:15px;
}

/* ORDER LIST */

.order{
background:#fafafa;
padding:10px;
border-top:1px solid #ddd;
max-height:180px;
overflow:auto;
}

.order-item{
display:flex;
justify-content:space-between;
margin:4px 0;
}

.total{
font-weight:bold;
font-size:18px;
margin-top:6px;
}

/* FOOTER */

.footer{
display:flex;
gap:10px;
padding:10px;
}

.footer button{
flex:1;
padding:12px;
border:none;
border-radius:12px;
font-size:16px;
color:white;
}

.reset{background:#e53935;}
.close{background:#757575;}

</style>
</head>

<body>

<header>WEB TÍNH BILL NHANH | THIẾT KẾ BỞI LƯƠNG MINH TRIỆU VĨ</header>

<div class="tables" id="tables"></div>

<div class="modal" id="modal">
<div class="modal-box">

<div class="menu" id="menu"></div>

<div class="order">
<div id="orderList"></div>
<div class="total" id="total"></div>
</div>

<div class="footer">
<button class="reset" onclick="resetTable()">Reset bàn</button>
<button class="close" onclick="closeModal()">Đóng</button>
</div>

</div>
</div>

<script>

/* ================= MENU DATA ================= */

const menuData = {

"Cà phê":[
["Cà phê đá",12000],
["Cà phê đen",10000],
["Cà phê sữa đá",15000],
["Cà phê muối",17000],
["Bạc xỉu",18000],
["Ca cao sữa",15000],
["Cà Phê Sương Sáo",20000],
["Soda",15000],
["Matcha Đá Xay",20000],
["Oreo Đá Xay",22000]
],
  
"Thuốc Lá":[
["SaiGon Bạc",20000],
["SaiGon Xì Gà",22000],
["Jet",30000],
["Hero",10000]
],
  
"Sinh tố":[
["Sinh tố Bơ",20000],
["Sinh tố Sầu riêng",25000],
["Sinh tố Mít",20000],
["Sinh tố Dâu",20000],
["Sinh tố Mãng cầu",20000],
["Sinh tố Kiwi",20000]
],

"Giải khát":[
["Lipton tắc xí muội",10000],
["Tắc xí muội",10000],
["Đá me",10000],
["Trà đường",8000]
],

"Ăn vặt":[
["Bánh tráng trộn",15000],
["Trái cây ly",10000],
["Mì ly",10000],
["Bánh Flan",4000]
],

"Trà trái cây":[
["Trà đào",17000],
["Trà vải",17000],
["Trà Kiwi",17000],
["Trà chanh dây hạt đác",20000],
["Trà dâu tằm hạt đác",20000],
["Trà mãng cầu",20000],
["Trà chanh Thái xanh",17000],
["Trà dưa lưới",17000],
["Trà dâu",17000],
["Trà ổi hồng",17000]
],

"Trà sữa":[
["Trà sữa thái xanh",20000],
["Trà sữa thái đỏ",20000],
["Sữa tươi TCDD",20000],
["Trà sữa Matcha",20000],
["Matcha latte",20000],
["Cacao latte",20000],
["Trà sữa việt quất",20000],
["Trà sữa socola",20000]
],

"Điểm tâm":[
["Hủ tiếu",25000],
["Cơm sườn",25000]
]

};

/* ================= TABLE DATA ================= */

let tables = JSON.parse(localStorage.getItem("tables")) || {};
let currentTable = null;

/* tạo bàn */

const tableDiv = document.getElementById("tables");

for(let i=1;i<=12;i++){

if(!tables[i]) tables[i]={items:{},total:0};

const div=document.createElement("div");
div.className="table";

div.innerHTML=`
<h3>Bàn ${i}</h3>
<div class="money">${tables[i].total.toLocaleString()} đ</div>
`;

div.onclick=()=>openTable(i);

tableDiv.appendChild(div);
}

/* ================= OPEN TABLE ================= */

function openTable(num){

currentTable=num;
document.getElementById("modal").style.display="flex";

renderMenu();
renderOrder();

}

/* ================= MENU ================= */

function renderMenu(){

const menu=document.getElementById("menu");
menu.innerHTML="";

for(let category in menuData){

menu.innerHTML+=`<div class="category">${category}</div>`;

menuData[category].forEach(item=>{

menu.innerHTML+=`
<button class="item-btn"
onclick="addItem('${item[0]}',${item[1]})">
${item[0]} - ${item[1].toLocaleString()}đ
</button>
`;

});

}

}

/* ================= ADD ITEM ================= */

function addItem(name,price){

const table=tables[currentTable];

if(!table.items[name])
table.items[name]={qty:0,price};

table.items[name].qty++;
table.total+=price;

save();
renderOrder();
refreshTables();

}

/* ================= ORDER ================= */

function renderOrder(){

const table=tables[currentTable];
const list=document.getElementById("orderList");

list.innerHTML="";

for(let item in table.items){

let i=table.items[item];

list.innerHTML+=`
<div class="order-item">
${item} x${i.qty}
<span onclick="removeItem('${item}')" style="color:red;cursor:pointer">❌</span>
</div>
`;

}

document.getElementById("total").innerText=
"Tổng: "+table.total.toLocaleString()+" đ";

}

/* ================= REMOVE ================= */

function removeItem(name){

const table=tables[currentTable];
table.total-=table.items[name].price;
table.items[name].qty--;

if(table.items[name].qty<=0)
delete table.items[name];

save();
renderOrder();
refreshTables();

}

/* ================= RESET ================= */

function resetTable(){

tables[currentTable]={items:{},total:0};

save();
renderOrder();
refreshTables();

}

/* ================= SAVE ================= */

function save(){
localStorage.setItem("tables",JSON.stringify(tables));
}

/* refresh grid */

function refreshTables(){

document.querySelectorAll(".table").forEach((t,i)=>{

let num=i+1;
t.querySelector(".money").innerText=
tables[num].total.toLocaleString()+" đ";

});

}

/* CLOSE */

function closeModal(){
document.getElementById("modal").style.display="none";
}

</script>

</body>
</html>
