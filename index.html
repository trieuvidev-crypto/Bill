        <div class="header-info">
            <span class="date-time" id="datetime"></span>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <div class="main-container">
        <!-- LEFT PANEL - MENU -->
        <div class="menu-panel">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 Tìm món..." autocomplete="off">
            </div>
            
            <!-- Category Tabs -->
            <div class="category-tabs" id="categoryTabs"></div>
            
            <!-- Menu Items -->
            <div class="menu-items" id="menuItems"></div>
        </div>

        <!-- RIGHT PANEL - BILL -->
        <div class="bill-panel">
            <div class="bill-header">
                <h2>HÓA ĐƠN</h2>
                <button class="btn-clear-all" id="btnClearAll">🗑️ Xóa tất cả</button>
            </div>

            <!-- Bill Items -->
            <div class="bill-items" id="billItems">
                <div class="empty-bill">
                    <p>☕ Chưa có món nào</p>
                    <p>Chọn món từ menu bên trái</p>
                </div>
            </div>

            <!-- Bill Summary -->
            <div class="bill-summary">
                <div class="summary-row">
                    <span>Tổng số món:</span>
                    <span id="totalItems">0</span>
                </div>
                <div class="summary-row total-row">
                    <span>TỔNG TIỀN:</span>
                    <span id="totalPrice">0đ</span>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="action-buttons">
                <button class="btn-action btn-payment" id="btnPayment">
                     THANH TOÁN
                </button>
                <button class="btn-action btn-copy" id="btnCopy">
                     SAO CHÉP ĐƠN
                </button>
             <!--   <button class="btn-action btn-sms" id="btnSMS">
                     Gửi SMS
                </button> -->
             <!--   <button class="btn-action btn-whatsapp" id="btnWhatsApp">
                     WhatsApp
                </button> -->
                <button class="btn-action btn-zalo" id="btnZalo">
                     Zalo
                </button>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="footer">
        <p>© Team CoffeeSang - Hệ thống quản lý bán hàng chuyên nghiệp</p>
    </footer>

    <!-- Modal Thanh Toán -->
    <div class="modal" id="paymentModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>THANH TOÁN THÀNH CÔNG</h2>
            </div>
            <div class="modal-body">
                <div class="success-icon"></div>
                <p class="success-message">Đã hoàn tất thanh toán</p>
                <div class="payment-total">
                    <span>Tổng tiền:</span>
                    <span id="modalTotalPrice"></span>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-modal" id="btnCloseModal">Đóng</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
